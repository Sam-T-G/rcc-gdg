  <g stroke="#0d652d" stroke-width="5">
    <rect x="80" y="120" width="1440" height="130" rx="24" fill="#0d652d"/>
    <rect x="80" y="275" width="1440" height="130" rx="24" fill="#e6f4ea"/>
